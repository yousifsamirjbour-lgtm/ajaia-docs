version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/ajaia_docs.db
      - ALLOWED_ORIGINS=*
    volumes:
      - ajaia_data:/app/data
    restart: unless-stopped

volumes:
  ajaia_data:
